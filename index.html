    <!-- LOGIKA APLIKACJI + SYNCHRONIZACJA (LOCALSTORAGE + CHMURA WIELU KOMÓREK)   -->
    <!-- ========================================================================= -->
    <script type="module">
        // Opcjonalna integracja z Firebase Firestore (jeśli środowisko udostępnia __firebase_config)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.cloudSync = {
            enabled: false,
            db: null,
            docRef: null,
            isApplyingRemote: false
        };

        async function initOptionalCloudSync() {
            try {
                if (typeof __firebase_config === 'undefined' || !__firebase_config) {
                    return;
                }
                const firebaseConfig = JSON.parse(__firebase_config);
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'volley-club-default';
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                const roomId = (window.getActiveRoomKey && window.getActiveRoomKey()) || 'active_tournament';
                const tournamentDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'tournaments', roomId);
                window.cloudSync.enabled = true;
                window.cloudSync.db = db;
                window.cloudSync.docRef = tournamentDocRef;

                onSnapshot(tournamentDocRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const remoteData = snapshot.data();
                        if (remoteData && remoteData.payload) {
                            window.cloudSync.isApplyingRemote = true;
                            window.mergeRemoteTournamentPayload(JSON.parse(remoteData.payload));
                            window.cloudSync.isApplyingRemote = false;
                        }
                    }
                }, (err) => {
                    console.warn('Ostrzeżenie synchronizacji Firestore:', err);
                });
            } catch (e) {
                console.warn('Tryb chmury HTTP / lokalny aktywny:', e);
            }
        }

        window.pushStateToFirestoreIfReady = async function() {
            if (!window.cloudSync.enabled || !window.cloudSync.docRef || window.cloudSync.isApplyingRemote) return;
            try {
                const payload = JSON.stringify(window.getSerializableTournamentState());
                await setDoc(window.cloudSync.docRef, {
                    payload,
                    updatedAt: Date.now()
                });
            } catch (e) {
                console.warn('Błąd wysyłania aktualizacji do Firestore:', e);
            }
        };

        initOptionalCloudSync();
    </script>

    <script>
        const STORAGE_PREFIX = 'volley_manager_pro_v2_room_';
        const SESSION_KEY = 'volley_manager_session_v2';
        const DEFAULT_KVDB_BUCKET = 'VolleyManagerProClubSync2026';

        // Domyślny stan turnieju (współdzielony między rolami i urządzeniami)
        let appState = {
            updatedAt: Date.now(),
            config: {
                name: 'Turniej Siatkówki Młodzieżowej – Dwójki i Trójki',
                category: 'Dwójki i Trójki',
                location: 'Hala Sportowa Centrum',
                date: new Date().toISOString().split('T')[0],
                startTime: '09:00',
                courts: 2,
                matchDuration: 20,
                setFormat: 'BO3_15_11',
                pointsSystem: 'SIMPLE_2_1'
            },
            sync: {
                enabled: true,
                roomKey: 'uks-turniej-2026',
                provider: 'KVDB_PUBLIC',
                customUrl: '',
                lastSyncAt: null,
                lastStatus: 'Gotowy'
            },
            security: {
                refereePin: '1111',
                adminPassword: 'admin123'
            },
            teams: [],
            matches: []
        };

        // Stan lokalnej sesji użytkownika (rola, wybrane boisko sędziego, aktywna zakładka)
        let sessionState = {
            role: 'public',          // 'public' | 'referee' | 'admin'
            forcedPublic: false,     // true gdy ?mode=public w URL
            refereeCourt: 'ALL',     // 'ALL' lub numer boiska '1', '2'...
            activeMatchId: null,     // ID meczu otwartego aktualnie na tablicy sędziowskiej
            publicTab: 'schedule',
            adminTab: 'schedule'
        };

        let cloudPollTimer = null;
        let isCloudSyncInFlight = false;
        let editingMatchId = null;

        function sanitizeRoomKey(raw) {
            const clean = String(raw || '').toLowerCase().replace(/[^a-z0-9-_]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
            return clean || 'uks-turniej-2026';
        }

        function getActiveRoomKey() {
            return sanitizeRoomKey(appState.sync && appState.sync.roomKey);
        }

        window.getActiveRoomKey = getActiveRoomKey;

        function getStorageKeyForRoom(roomKey) {
            return `${STORAGE_PREFIX}${sanitizeRoomKey(roomKey)}`;
        }

        // =========================================================================
        // INICJALIZACJA APLIKACJI I OBSŁUGA PARAMETRÓW URL
        // =========================================================================
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const urlRoom = urlParams.get('room');
            if (urlRoom) {
                appState.sync.roomKey = sanitizeRoomKey(urlRoom);
            }

            loadStateFromStorage();
            loadSessionFromStorage();

            if (urlRoom) {
                appState.sync.roomKey = sanitizeRoomKey(urlRoom);
                saveStateToStorage(false);
            }

            if (appState.teams.length === 0 && appState.matches.length === 0) {
                populateDemoData(false);
            }

            const urlMode = urlParams.get('mode');
            if (urlMode === 'public') {
                sessionState.role = 'public';
                sessionState.forcedPublic = true;
            } else if (urlMode === 'referee') {
                sessionState.role = 'public';
                sessionState.forcedPublic = false;
                setTimeout(() => openLoginModal('referee'), 150);
            } else if (urlMode === 'admin') {
                sessionState.role = 'public';
                sessionState.forcedPublic = false;
                setTimeout(() => openLoginModal('admin'), 150);
            }

            window.addEventListener('storage', (e) => {
                if (e.key === getStorageKeyForRoom(getActiveRoomKey()) && e.newValue) {
                    try {
                        const updated = JSON.parse(e.newValue);
                        window.mergeRemoteTournamentPayload(updated);
                    } catch (err) {
                        console.error('Błąd synchronizacji między kartami:', err);
                    }
                }
            });

            syncSettingsForm();
            applyRoleUI();
            renderAll();
            startCloudSyncLoop();
        });

        window.getSerializableTournamentState = function() {
            return {
                ...appState,
                updatedAt: appState.updatedAt || Date.now()
            };
        };

        window.mergeRemoteTournamentPayload = function(remoteData) {
            if (!remoteData || typeof remoteData !== 'object') return;

            const currentRoom = getActiveRoomKey();
            const remoteRoom = sanitizeRoomKey(remoteData.sync && remoteData.sync.roomKey);
            if (remoteData.sync && remoteData.sync.roomKey && remoteRoom !== currentRoom) {
                return;
            }

            const remoteTs = Number(remoteData.updatedAt) || 0;
            const localTs = Number(appState.updatedAt) || 0;
            const isRemoteNewerGlobal = remoteTs >= localTs;

            if (remoteData.config && (isRemoteNewerGlobal || appState.teams.length === 0)) {
                appState.config = { ...appState.config, ...remoteData.config };
            }
            if (remoteData.security && isRemoteNewerGlobal) {
                appState.security = { ...appState.security, ...remoteData.security };
            }

            if (Array.isArray(remoteData.teams) && remoteData.teams.length > 0) {
                if (isRemoteNewerGlobal || appState.teams.length === 0) {
                    appState.teams = remoteData.teams;
                } else {
                    const teamMap = new Map(appState.teams.map(t => [t.id, t]));
                    remoteData.teams.forEach(rt => {
                        if (!teamMap.has(rt.id)) teamMap.set(rt.id, rt);
                    });
                    appState.teams = Array.from(teamMap.values());
                }
            }

            if (Array.isArray(remoteData.matches) && remoteData.matches.length > 0) {
                if (appState.matches.length === 0) {
                    appState.matches = remoteData.matches;
                } else {
                    const localMatchMap = new Map(appState.matches.map(m => [m.id, m]));
                    const mergedMatches = [];
                    const seenIds = new Set();

                    remoteData.matches.forEach(rm => {
                        seenIds.add(rm.id);
                        const lm = localMatchMap.get(rm.id);
                        if (!lm) {
                            mergedMatches.push(rm);
                        } else {
                            const rMatchTs = Number(rm.matchUpdatedAt || rm.updatedAt || remoteTs) || 0;
                            const lMatchTs = Number(lm.matchUpdatedAt || lm.updatedAt || localTs) || 0;
                            if (rMatchTs >= lMatchTs) {
                                mergedMatches.push(rm);
                            } else {
                                mergedMatches.push(lm);
                            }
                        }
                    });

                    appState.matches.forEach(lm => {
                        if (!seenIds.has(lm.id)) {
                            mergedMatches.push(lm);
                        }
                    });

                    appState.matches = mergedMatches;
                }
            }

            if (remoteTs > localTs) {
                appState.updatedAt = remoteTs;
            }
            appState.sync.lastSyncAt = new Date().toLocaleTimeString('pl-PL');
            appState.sync.lastStatus = 'Zsynchronizowano';

            try {
                localStorage.setItem(getStorageKeyForRoom(currentRoom), JSON.stringify(appState));
            } catch (e) {}

            renderAll();
        };

        function saveStateToStorage(pushToCloud = true, changedMatchId = null) {
            try {
                const now = Date.now();
                appState.updatedAt = now;
                if (changedMatchId) {
                    const m = appState.matches.find(x => x.id === changedMatchId);
                    if (m) m.matchUpdatedAt = now;
                }
                const key = getStorageKeyForRoom(getActiveRoomKey());
                localStorage.setItem(key, JSON.stringify(appState));

                if (pushToCloud && appState.sync && appState.sync.enabled) {
                    pushStateToCloudEndpoint();
                    if (window.pushStateToFirestoreIfReady) {
                        window.pushStateToFirestoreIfReady();
                    }
                }
            } catch (e) {
                console.error('Błąd zapisu stanu:', e);
            }
        }

        function loadStateFromStorage() {
            try {
                const key = getStorageKeyForRoom(getActiveRoomKey());
                const raw = localStorage.getItem(key);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    appState = {
                        ...appState,
                        ...parsed,
                        updatedAt: Number(parsed.updatedAt) || Date.now(),
                        config: { ...appState.config, ...(parsed.config || {}) },
                        sync: { ...appState.sync, ...(parsed.sync || {}) },
                        security: { ...appState.security, ...(parsed.security || {}) }
                    };
                }
            } catch (e) {
                console.error('Błąd odczytu stanu:', e);
            }
        }

        function saveSessionToStorage() {
            try {
                sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionState));
            } catch (e) {}
        }

        function loadSessionFromStorage() {
            try {
                const raw = sessionStorage.getItem(SESSION_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    sessionState = { ...sessionState, ...parsed };
                }
            } catch (e) {}
        }

        // =========================================================================
        // SILNIK SYNCHRONIZACJI CHMUROWEJ (WIELU KOMÓREK JEDNOCZEŚNIE)
        // =========================================================================
        function getCloudEndpointUrl() {
            const syncCfg = appState.sync || {};
            const room = sanitizeRoomKey(syncCfg.roomKey);
            if (syncCfg.provider === 'CUSTOM_JSON_ENDPOINT' && syncCfg.customUrl && syncCfg.customUrl.trim()) {
                return syncCfg.customUrl.trim().replace('{room}', encodeURIComponent(room));
            }
            return `https://kvdb.io/${DEFAULT_KVDB_BUCKET}/volley_${room}`;
        }

        async function pushStateToCloudEndpoint() {
            if (!appState.sync || !appState.sync.enabled) return;
            const url = getCloudEndpointUrl();
            if (!url) return;

            try {
                appState.sync.lastStatus = 'Wysyłanie...';
                updateSyncStatusIndicators();

                const bodyPayload = JSON.stringify({
                    ...appState,
                    sync: {
                        enabled: appState.sync.enabled,
                        roomKey: getActiveRoomKey(),
                        provider: appState.sync.provider
                    }
                });

                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: bodyPayload
                });

                if (res.ok) {
                    appState.sync.lastSyncAt = new Date().toLocaleTimeString('pl-PL');
                    appState.sync.lastStatus = 'Online (Wysłano)';
                } else {
                    appState.sync.lastStatus = 'Lokalnie (brak połączenia z chmurą)';
                }
            } catch (e) {
                appState.sync.lastStatus = 'Lokalnie (offline / ograniczenie sieci)';
            } finally {
                updateSyncStatusIndicators();
            }
        }

        async function pullStateFromCloudEndpoint(showNotification = false) {
            if (!appState.sync || !appState.sync.enabled || isCloudSyncInFlight) return;
            const url = getCloudEndpointUrl();
            if (!url) return;

            isCloudSyncInFlight = true;
            try {
                const res = await fetch(`${url}?t=${Date.now()}`, {
                    method: 'GET',
                    cache: 'no-store'
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data && data.config && Array.isArray(data.matches)) {
                        const remoteTs = Number(data.updatedAt) || 0;
                        const localTs = Number(appState.updatedAt) || 0;

                        if (remoteTs > localTs || appState.matches.length === 0) {
                            window.mergeRemoteTournamentPayload(data);
                        } else {
                            appState.sync.lastSyncAt = new Date().toLocaleTimeString('pl-PL');
                            appState.sync.lastStatus = 'Online (Aktualne)';
                            updateSyncStatusIndicators();
                        }

                        if (showNotification) {
                            showToast(`Zsynchronizowano z pokojem: ${getActiveRoomKey()}`);
                        }
                    }
                } else if (res.status === 404) {
                    if (appState.matches.length > 0 || appState.teams.length > 0) {
                        await pushStateToCloudEndpoint();
                    }
                    if (showNotification) {
                        showToast('Utworzono nowy pokój w chmurze i wysłano dane.', 'info');
                    }
                }
            } catch (e) {
                appState.sync.lastStatus = 'Lokalnie (tryb offline)';
                updateSyncStatusIndicators();
                if (showNotification) {
                    showToast('Brak odpowiedzi z chmury — działasz na pamięci lokalnej.', 'info');
                }
            } finally {
                isCloudSyncInFlight = false;
            }
        }

        async function forceSyncNow() {
            if (!appState.sync.enabled) {
                appState.sync.enabled = true;
            }
            await pullStateFromCloudEndpoint(false);
            await pushStateToCloudEndpoint();
            showToast(`Synchronizacja pokoju "${getActiveRoomKey()}" zakończona.`);
        }

        function startCloudSyncLoop() {
            if (cloudPollTimer) clearInterval(cloudPollTimer);
            pullStateFromCloudEndpoint(false);
            cloudPollTimer = setInterval(() => {
                if (appState.sync && appState.sync.enabled && document.visibilityState !== 'hidden') {
                    pullStateFromCloudEndpoint(false);
                }
            }, 3000);
        }

        function updateSyncStatusIndicators() {
            const room = getActiveRoomKey();
            const enabled = Boolean(appState.sync && appState.sync.enabled);
            const lastTime = (appState.sync && appState.sync.lastSyncAt) || 'oczekiwanie...';
            const statusText = (appState.sync && appState.sync.lastStatus) || (enabled ? 'Aktywna' : 'Wyłączona');

            const footerEl = document.getElementById('footer-sync-info');
            if (footerEl) {
                footerEl.textContent = enabled
                    ? `Pokój: ${room} • ${statusText} (${lastTime})`
                    : `Synchronizacja wyłączona (Pokój: ${room})`;
            }

            const headerBadgeText = document.getElementById('sync-status-text');
            if (headerBadgeText) {
                headerBadgeText.textContent = enabled ? `Pokój: ${room}` : 'Offline';
            }

            const pill = document.getElementById('cfg-sync-live-pill');
            if (pill) {
                pill.textContent = enabled ? `Aktywna (${room})` : 'Wyłączona';
                pill.className = enabled
                    ? 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800'
                    : 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-slate-200 text-slate-600';
            }

            const cfgStatus = document.getElementById('cfg-sync-status-label');
            const cfgLast = document.getElementById('cfg-sync-last-time');
            if (cfgStatus) cfgStatus.textContent = enabled ? statusText : 'Wyłączona (tylko to urządzenie)';
            if (cfgLast) cfgLast.textContent = lastTime;
        }

        function randomizeRoomKey() {
            const words = ['volley', 'siatka', 'hala', 'puchar', 'turniej', 'junior'];
            const w = words[Math.floor(Math.random() * words.length)];
            const num = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('cfg-sync-room').value = `${w}-${num}`;
            showToast('Wylosowano nowy klucz pokoju. Kliknij "Zapisz ustawienia", aby aktywować.', 'info');
        }

        function copyRoomKey() {
            const val = sanitizeRoomKey(document.getElementById('cfg-sync-room').value);
            const tempInput = document.createElement('input');
            tempInput.value = val;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast(`Skopiowano klucz pokoju: ${val}`);
        }

        function toggleCustomSyncUrl() {
            const provider = document.getElementById('cfg-sync-provider').value;
            const wrap = document.getElementById('cfg-custom-endpoint-wrap');
            if (provider === 'CUSTOM_JSON_ENDPOINT') {
                wrap.classList.remove('hidden');
            } else {
                wrap.classList.add('hidden');
            }
        }

        // =========================================================================
        // SYSTEM LOGOWANIA I PRZEŁĄCZANIA RÓL
        // =========================================================================
        function openLoginModal(defaultRole = 'referee') {
            const courtSel = document.getElementById('login-referee-court');
            let opts = '<option value="ALL">Wszystkie boiska</option>';
            for (let c = 1; c <= appState.config.courts; c++) {
                opts += `<option value="${c}">Boisko ${c}</option>`;
            }
            courtSel.innerHTML = opts;

            document.getElementById('hint-referee-pin').textContent = appState.security.refereePin;
            document.getElementById('hint-admin-pass').textContent = appState.security.adminPassword;

            switchLoginRole(defaultRole);
            const modal = document.getElementById('login-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeLoginModal() {
            const modal = document.getElementById('login-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function switchLoginRole(role) {
            const tabRef = document.getElementById('login-tab-referee');
            const tabAdm = document.getElementById('login-tab-admin');
            const formRef = document.getElementById('form-login-referee');
            const formAdm = document.getElementById('form-login-admin');

            if (role === 'referee') {
                tabRef.className = 'py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 bg-white text-slate-900 shadow-sm';
                tabAdm.className = 'py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 text-slate-500 hover:text-slate-800';
                formRef.classList.remove('hidden');
                formAdm.classList.add('hidden');
            } else {
                tabAdm.className = 'py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 bg-white text-slate-900 shadow-sm';
                tabRef.className = 'py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 text-slate-500 hover:text-slate-800';
                formAdm.classList.remove('hidden');
                formRef.classList.add('hidden');
            }
        }

        function handleRefereeLogin(e) {
            e.preventDefault();
            const pin = document.getElementById('login-referee-pin').value.trim();
            const selectedCourt = document.getElementById('login-referee-court').value;

            if (pin !== appState.security.refereePin) {
                showToast('Nieprawidłowy kod PIN sędziego!', 'error');
                return;
            }

            sessionState.role = 'referee';
            sessionState.refereeCourt = selectedCourt;
            sessionState.activeMatchId = null;
            document.getElementById('login-referee-pin').value = '';
            saveSessionToStorage();
            closeLoginModal();
            applyRoleUI();
            renderAll();
            showToast(`Zalogowano jako Sędzia (${selectedCourt === 'ALL' ? 'Wszystkie boiska' : 'Boisko ' + selectedCourt})`);
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('login-admin-password').value.trim();
            if (pass !== appState.security.adminPassword) {
                showToast('Nieprawidłowe hasło organizatora!', 'error');
                return;
            }

            sessionState.role = 'admin';
            document.getElementById('login-admin-password').value = '';
            saveSessionToStorage();
            closeLoginModal();
            applyRoleUI();
            renderAll();
            showToast('Zalogowano do Panelu Organizatora Turnieju.');
        }

        function logoutRole() {
            sessionState.role = 'public';
            sessionState.activeMatchId = null;
            saveSessionToStorage();
            applyRoleUI();
            renderAll();
            showToast('Wylogowano. Powrót do widoku kibica.', 'info');
        }

        function applyRoleUI() {
            const role = sessionState.role;
            const viewPublic = document.getElementById('role-view-public');
            const viewReferee = document.getElementById('role-view-referee');
            const viewAdmin = document.getElementById('role-view-admin');

            const btnLogin = document.getElementById('btn-open-staff-login');
            const roleBanner = document.getElementById('active-role-banner');
            const roleLabel = document.getElementById('active-role-label');

            viewPublic.classList.add('hidden');
            viewReferee.classList.add('hidden');
            viewAdmin.classList.add('hidden');

            if (role === 'public') {
                viewPublic.classList.remove('hidden');
                roleBanner.classList.add('hidden');
                roleBanner.classList.remove('flex');
                if (sessionState.forcedPublic) {
                    btnLogin.classList.add('hidden');
                } else {
                    btnLogin.classList.remove('hidden');
                }
            } else if (role === 'referee') {
                viewReferee.classList.remove('hidden');
                btnLogin.classList.add('hidden');
                roleBanner.classList.remove('hidden');
                roleBanner.classList.add('flex');
                const courtText = sessionState.refereeCourt === 'ALL' ? 'Wszystkie boiska' : `Boisko ${sessionState.refereeCourt}`;
                roleLabel.innerHTML = `<i class="fa-solid fa-whistle text-orange-400"></i> Sędzia (${courtText})`;
            } else if (role === 'admin') {
                viewAdmin.classList.remove('hidden');
                btnLogin.classList.add('hidden');
                roleBanner.classList.remove('hidden');
                roleBanner.classList.add('flex');
                roleLabel.innerHTML = `<i class="fa-solid fa-user-shield text-sky-400"></i> Organizator Turnieju`;
            }
        }

        // =========================================================================
        // POWIADOMIENIA (TOAST), MODALE POTWIERDZEŃ I LINKI OSADZANIA
        // =========================================================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const styles = {
                success: 'bg-slate-900 text-white border-emerald-500',
                error: 'bg-rose-950 text-white border-rose-500',
                info: 'bg-sky-950 text-white border-sky-400'
            };
            const icons = {
                success: '<i class="fa-solid fa-circle-check text-emerald-400"></i>',
                error: '<i class="fa-solid fa-circle-exclamation text-rose-400"></i>',
                info: '<i class="fa-solid fa-circle-info text-sky-400"></i>'
            };

            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl border-l-4 text-xs sm:text-sm font-semibold transform transition-all duration-300 translate-y-2 opacity-0 ${styles[type] || styles.success}`;
            toast.innerHTML = `${icons[type] || icons.success}<span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3200);

        // =========================================================================
        // LOGIKA PRZEPISÓW SIATKARSKICH (SETY, LIMITY, PRZEWAGA 2 PKT)
        // =========================================================================
        function getSetRulesForIndex(setIndex) {
            const fmt = appState.config.setFormat;
            if (fmt === 'ONE_SET_21') return { target: 21, maxSets: 1, label: 'Jeden set do 21 pkt (przewaga 2 pkt)' };
            if (fmt === 'ONE_SET_25') return { target: 25, maxSets: 1, label: 'Jeden set do 25 pkt (przewaga 2 pkt)' };
            if (fmt === 'FIXED_2_15') return { target: 15, maxSets: 2, label: `Set ${setIndex + 1} z 2 (do 15 pkt, przewaga 2 pkt)` };
            if (fmt === 'BO3_25_15') {
                if (setIndex === 2) return { target: 15, maxSets: 3, label: 'Tie-break / Set 3 (do 15 pkt, przewaga 2 pkt)' };
                return { target: 25, maxSets: 3, label: `Set ${setIndex + 1} (do 25 pkt, przewaga 2 pkt)` };
            }
            if (setIndex === 2) return { target: 11, maxSets: 3, label: 'Tie-break / Set 3 (do 11 pkt, przewaga 2 pkt)' };
            return { target: 15, maxSets: 3, label: `Set ${setIndex + 1} (do 15 pkt, przewaga 2 pkt)` };
        }

        function isSetFinishedByRules(ptsA, ptsB, target) {
            const a = Number(ptsA) || 0;
            const b = Number(ptsB) || 0;
            return (a >= target || b >= target) && Math.abs(a - b) >= 2;
        }

        function evaluateMatch(match) {
            let setsA = 0;
            let setsB = 0;
            let pointsA = 0;
            let pointsB = 0;

            const fmt = appState.config.setFormat;
            const activeIdx = match.activeSetIndex || 0;

            match.sets.forEach((s, idx) => {
                const a = s.a !== '' && s.a !== null ? Number(s.a) : null;
                const b = s.b !== '' && s.b !== null ? Number(s.b) : null;
                if (a === null || b === null) return;
                if (a === 0 && b === 0) return;

                pointsA += a;
                pointsB += b;

                const rule = getSetRulesForIndex(idx);
                const setCompleted = match.finished || idx < activeIdx || isSetFinishedByRules(a, b, rule.target);

                if (setCompleted) {
                    if (a > b) setsA++;
                    else if (b > a) setsB++;
                }
            });

            let matchWinnerReady = false;
            if (fmt === 'ONE_SET_21' || fmt === 'ONE_SET_25') {
                matchWinnerReady = (setsA === 1 || setsB === 1);
            } else if (fmt === 'FIXED_2_15') {
                matchWinnerReady = (setsA + setsB === 2);
            } else {
                matchWinnerReady = (setsA === 2 || setsB === 2);
            }

            return { setsA, setsB, pointsA, pointsB, matchWinnerReady };
        }

        function createEmptySets() {
            const fmt = appState.config.setFormat;
            if (fmt === 'ONE_SET_21' || fmt === 'ONE_SET_25') return [{ a: '', b: '' }];
            if (fmt === 'FIXED_2_15') return [{ a: '', b: '' }, { a: '', b: '' }];
            return [{ a: '', b: '' }, { a: '', b: '' }, { a: '', b: '' }];
        }

            const tA = getTeamDisplay(match.teamAId, match.teamAPlaceholder);
            const tB = getTeamDisplay(match.teamBId, match.teamBPlaceholder);
            const curIdx = match.activeSetIndex || 0;
            const curSet = match.sets[curIdx] || { a: 0, b: 0 };
            const ev = evaluateMatch(match);
            const rule = getSetRulesForIndex(curIdx);

            document.getElementById('ref-board-meta').textContent = `Boisko ${match.court} • ${match.stageLabel} • Planowo: ${match.time}`;

        function adjustLivePoint(side, delta) {
            const match = appState.matches.find(m => m.id === sessionState.activeMatchId);
            if (!match) return;

            const idx = match.activeSetIndex || 0;
            const currentVal = Number(match.sets[idx][side === 'A' ? 'a' : 'b']) || 0;
            const nextVal = Math.max(0, currentVal + delta);
            match.sets[idx][side === 'A' ? 'a' : 'b'] = nextVal;

            saveStateToStorage(true, match.id);
            renderRefereeScoreboard(match);
            renderPublicLiveCourts();
        }

        function selectRefereeSet(setIdx) {
            const match = appState.matches.find(m => m.id === sessionState.activeMatchId);
            if (!match || setIdx < 0 || setIdx >= match.sets.length) return;

            match.activeSetIndex = setIdx;
            if (match.sets[setIdx].a === '') match.sets[setIdx].a = 0;
            if (match.sets[setIdx].b === '') match.sets[setIdx].b = 0;

            saveStateToStorage(true, match.id);
            renderRefereeScoreboard(match);
        }

            const match = appState.matches.find(m => m.id === sessionState.activeMatchId);

        // =========================================================================
        // WSPÓLNE TABELE GRUPOWE, DRUŻYNY, GENERATOR HARMONOGRAMU I FAZY PUCHAROWEJ
        // =========================================================================
        function computeGroupStandings() {
            const groups = {};
            appState.teams.forEach(team => {
                if (!groups[team.group]) groups[team.group] = [];
                groups[team.group].push({
                    team, played: 0, points: 0, won: 0, lost: 0,
                    setsWon: 0, setsLost: 0, smallPtsWon: 0, smallPtsLost: 0
                });
            });

            appState.matches.filter(m => m.stage === 'GROUP' && (m.status === 'FINISHED' || m.finished)).forEach(match => {
                const rows = groups[match.group];
                if (!rows) return;
                const rowA = rows.find(r => r.team.id === match.teamAId);
                const rowB = rows.find(r => r.team.id === match.teamBId);
                if (!rowA || !rowB) return;

                const ev = evaluateMatch(match);
                rowA.played++; rowB.played++;
                rowA.setsWon += ev.setsA; rowA.setsLost += ev.setsB;
                rowB.setsWon += ev.setsB; rowB.setsLost += ev.setsA;
                rowA.smallPtsWon += ev.pointsA; rowA.smallPtsLost += ev.pointsB;
                rowB.smallPtsWon += ev.pointsB; rowB.smallPtsLost += ev.pointsA;

                if (ev.setsA > ev.setsB) {
                    rowA.won++; rowB.lost++;
                    if (appState.config.pointsSystem === 'FIVB_3_2_1_0') {
                        rowA.points += (ev.setsB === 0 ? 3 : 2);
                        rowB.points += (ev.setsB === 0 ? 0 : 1);
                    } else {
                        rowA.points += 2; rowB.points += 1;
                    }
                } else if (ev.setsB > ev.setsA) {
                    rowB.won++; rowA.lost++;
                    if (appState.config.pointsSystem === 'FIVB_3_2_1_0') {
                        rowB.points += (ev.setsA === 0 ? 3 : 2);
                        rowA.points += (ev.setsA === 0 ? 0 : 1);
                    } else {
                        rowB.points += 2; rowA.points += 1;
                    }
                } else {
                    rowA.points += 1; rowB.points += 1;
                }
            });

            Object.keys(groups).forEach(g => {
                groups[g].sort((a, b) => {
                    if (b.points !== a.points) return b.points - a.points;
                    if (b.won !== a.won) return b.won - a.won;
                    const srA = a.setsLost === 0 ? (a.setsWon > 0 ? 999 : 0) : a.setsWon / a.setsLost;
                    const srB = b.setsLost === 0 ? (b.setsWon > 0 ? 999 : 0) : b.setsWon / b.setsLost;
                    if (Math.abs(srB - srA) > 0.0001) return srB - srA;
                    const prA = a.smallPtsLost === 0 ? (a.smallPtsWon > 0 ? 999 : 0) : a.smallPtsWon / a.smallPtsLost;
                    const prB = b.smallPtsLost === 0 ? (b.smallPtsWon > 0 ? 999 : 0) : b.smallPtsWon / b.smallPtsLost;
                    return prB - prA;
                });
            });
            return groups;
        }

        function generateGroupSchedule(askConfirm = true) {
            if (appState.teams.length < 2) {
                showToast('Dodaj najpierw co najmniej 2 drużyny.', 'error');
                return;
            }

            const run = () => {
                const groupsMap = {};
                appState.teams.forEach(t => {
                    if (!groupsMap[t.group]) groupsMap[t.group] = [];
                    groupsMap[t.group].push(t);
                });

                let rawPairs = [];
                Object.keys(groupsMap).sort().forEach(gName => {
                    const gTeams = [...groupsMap[gName]];
                    if (gTeams.length < 2) return;
                    if (gTeams.length % 2 !== 0) gTeams.push(null);

                    const n = gTeams.length;
                    for (let r = 0; r < n - 1; r++) {
                        for (let i = 0; i < n / 2; i++) {
                            const t1 = gTeams[i];
                            const t2 = gTeams[n - 1 - i];
                            if (t1 && t2) {
                                rawPairs.push({
                                    group: gName, round: r + 1,
                                    teamAId: t1.id, teamBId: t2.id,
                                    clubA: (t1.club || t1.name).toLowerCase(),
                                    clubB: (t2.club || t2.name).toLowerCase()
                                });
                            }
                        }
                        const last = gTeams.pop();
                        gTeams.splice(1, 0, last);
                    }
                });

                rawPairs.sort((a, b) => a.round - b.round || a.group.localeCompare(b.group));

                const numCourts = appState.config.courts || 2;
                const scheduled = [];
                const remaining = [...rawPairs];
                let slotIdx = 0;

                while (remaining.length > 0) {
                    const busyTeams = new Set();
                    const busyClubs = new Set();

                    for (let court = 1; court <= numCourts; court++) {
                        if (remaining.length === 0) break;

                        let idx = remaining.findIndex(m =>
                            !busyTeams.has(m.teamAId) && !busyTeams.has(m.teamBId) &&
                            !busyClubs.has(m.clubA) && !busyClubs.has(m.clubB)
                        );
                        if (idx === -1) {
                            idx = remaining.findIndex(m => !busyTeams.has(m.teamAId) && !busyTeams.has(m.teamBId));
                        }
                        if (idx === -1) idx = 0;

                        const match = remaining.splice(idx, 1)[0];
                        busyTeams.add(match.teamAId); busyTeams.add(match.teamBId);
                        busyClubs.add(match.clubA); busyClubs.add(match.clubB);

                        scheduled.push({
                            id: 'm_' + Date.now() + '_' + scheduled.length,
                            stage: 'GROUP',
                            stageLabel: `Grupa ${match.group}`,
                            group: match.group,
                            court,
                            slot: slotIdx,
                            time: calculateSlotTime(slotIdx),
                            teamAId: match.teamAId,
                            teamBId: match.teamBId,
                            teamAPlaceholder: '',
                            teamBPlaceholder: '',
                            sets: createEmptySets(),
                            activeSetIndex: 0,
                            status: 'PENDING',
                            finished: false
                        });
                    }
                    slotIdx++;
                }

                appState.matches = scheduled;
                saveStateToStorage(true);
                renderAll();
                switchAdminTab('schedule');
                showToast(`Wygenerowano ${scheduled.length} meczów na ${numCourts} boiskach!`);
            };

            if (askConfirm && appState.matches.length > 0) {
                showConfirmModal('Wygenerować nowy harmonogram?', 'Dotychczasowe mecze i wpisane wyniki zostaną zastąpione.', run);
            } else {
                run();
            }
        }

        function calculateSlotTime(slotIndex) {
            const [hStr, mStr] = (appState.config.startTime || '09:00').split(':');
            const total = parseInt(hStr, 10) * 60 + parseInt(mStr, 10) + slotIndex * (appState.config.matchDuration || 20);
            const h = Math.floor(total / 60) % 24;
            const m = total % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        function moveMatch(idx, dir) {
            const target = idx + dir;
            if (target < 0 || target >= appState.matches.length) return;
            const tmp = appState.matches[idx];
            appState.matches[idx] = appState.matches[target];
            appState.matches[target] = tmp;

            const c = appState.matches[idx].court, t = appState.matches[idx].time, s = appState.matches[idx].slot;
            appState.matches[idx].court = appState.matches[target].court;
            appState.matches[idx].time = appState.matches[target].time;
            appState.matches[idx].slot = appState.matches[target].slot;
            appState.matches[target].court = c;
            appState.matches[target].time = t;
            appState.matches[target].slot = s;

            saveStateToStorage(true);
            renderAll();
        }

            const reader = new FileReader();

                try {
                    const data = JSON.parse(ev.target.result);
                    if (!data.config || !Array.isArray(data.teams)) throw new Error('Nieprawidłowy plik.');
                    appState = { ...appState, ...data, updatedAt: Date.now() };
                    saveStateToStorage(true);
                    syncSettingsForm();
                    renderAll();
                    showToast('Wczytano turniej z pliku JSON!');
                } catch (err) {
                    showToast('Błąd pliku: ' + err.message, 'error');

                e.target.value = '';
            };
            reader.readAsText(file);
        }

            ];

            generateGroupSchedule(false);

            if (appState.matches.length >= 4) {
                appState.matches[0].sets = [{ a: 15, b: 10 }, { a: 15, b: 12 }, { a: '', b: '' }];
                appState.matches[0].status = 'FINISHED';
                appState.matches[0].finished = true;

                appState.matches[1].sets = [{ a: 12, b: 15 }, { a: 15, b: 11 }, { a: 11, b: 8 }];
                appState.matches[1].status = 'FINISHED';
                appState.matches[1].finished = true;

                appState.matches[2].sets = [{ a: 15, b: 12 }, { a: 11, b: 9 }, { a: '', b: '' }];
                appState.matches[2].activeSetIndex = 1;
                appState.matches[2].status = 'LIVE';
                appState.matches[2].finished = false;

                appState.matches[3].sets = [{ a: 8, b: 10 }, { a: '', b: '' }, { a: '', b: '' }];
                appState.matches[3].activeSetIndex = 0;
                appState.matches[3].status = 'LIVE';
                appState.matches[3].finished = false;
            }

            syncSettingsForm();
            saveStateToStorage(true);
            renderAll();
            if (notify) showToast('Załadowano turniej przykładowy (z 2 meczami LIVE na boiskach)!');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
