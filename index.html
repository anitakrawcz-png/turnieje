    <script type="module">
        // Opcjonalna integracja z Firebase Firestore (jeśli środowisko udostępnia __firebase_config)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.cloudSync = {
            enabled: false,
            db: null,
            docRef: null,
            isApplyingRemote: false
        };

        async function initOptionalCloudSync() {
            try {
                if (typeof __firebase_config === 'undefined' || !__firebase_config) {
                    return;
                }
                const firebaseConfig = JSON.parse(__firebase_config);
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'volley-club-default';
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                const roomId = (window.getActiveRoomKey && window.getActiveRoomKey()) || 'active_tournament';
                const tournamentDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'tournaments', roomId);
                window.cloudSync.enabled = true;
                window.cloudSync.db = db;
                window.cloudSync.docRef = tournamentDocRef;

                onSnapshot(tournamentDocRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const remoteData = snapshot.data();
                        if (remoteData && remoteData.payload) {
                            window.cloudSync.isApplyingRemote = true;
                            window.mergeRemoteTournamentPayload(JSON.parse(remoteData.payload));
                            window.cloudSync.isApplyingRemote = false;
                        }
                    }
                }, (err) => {
                    console.warn('Ostrzeżenie synchronizacji Firestore:', err);
                });
            } catch (e) {
                console.warn('Tryb chmury HTTP / lokalny aktywny:', e);
            }
        }

        window.pushStateToFirestoreIfReady = async function() {
            if (!window.cloudSync.enabled || !window.cloudSync.docRef || window.cloudSync.isApplyingRemote) return;
            try {
                const payload = JSON.stringify(window.getSerializableTournamentState());
                await setDoc(window.cloudSync.docRef, {
                    payload,
                    updatedAt: Date.now()
                });
            } catch (e) {
                console.warn('Błąd wysyłania aktualizacji do Firestore:', e);
            }
        };

        initOptionalCloudSync();
    </script>

    <script>
        const STORAGE_PREFIX = 'volley_manager_pro_v2_room_';
        const SESSION_KEY = 'volley_manager_session_v2';
        const DEFAULT_KVDB_BUCKET = 'VolleyManagerProClubSync2026';

        // Domyślny stan turnieju (współdzielony między rolami i urządzeniami)
        let appState = {
            updatedAt: Date.now(),
            config: {
                name: 'Turniej Siatkówki Młodzieżowej – Dwójki i Trójki',
                category: 'Dwójki i Trójki',
                location: 'Hala Sportowa Centrum',
                date: new Date().toISOString().split('T')[0],
                startTime: '09:00',
                courts: 2,
                matchDuration: 20,
                setFormat: 'BO3_15_11',
                pointsSystem: 'SIMPLE_2_1'
            },
            sync: {
                enabled: true,
                roomKey: 'uks-turniej-2026',
                provider: 'KVDB_PUBLIC',
                customUrl: '',
                lastSyncAt: null,
                lastStatus: 'Gotowy'
            },
            security: {
                refereePin: '1111',
                adminPassword: 'admin123'
            },
            teams: [],
            matches: []
        };

        // Stan lokalnej sesji użytkownika (rola, wybrane boisko sędziego, aktywna zakładka)
        let sessionState = {
            role: 'public',          // 'public' | 'referee' | 'admin'
            forcedPublic: false,     // true gdy ?mode=public w URL
            refereeCourt: 'ALL',     // 'ALL' lub numer boiska '1', '2'...
            activeMatchId: null,     // ID meczu otwartego aktualnie na tablicy sędziowskiej
            publicTab: 'schedule',
            adminTab: 'schedule'
        };

        let cloudPollTimer = null;
        let isCloudSyncInFlight = false;
        let editingMatchId = null;

        function sanitizeRoomKey(raw) {
            const clean = String(raw || '').toLowerCase().replace(/[^a-z0-9-_]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
            return clean || 'uks-turniej-2026';
        }

        function getActiveRoomKey() {
            return sanitizeRoomKey(appState.sync && appState.sync.roomKey);
        }

        window.getActiveRoomKey = getActiveRoomKey;

        function getStorageKeyForRoom(roomKey) {
            return `${STORAGE_PREFIX}${sanitizeRoomKey(roomKey)}`;
        }

        // =========================================================================
        // INICJALIZACJA APLIKACJI I OBSŁUGA PARAMETRÓW URL
        // =========================================================================
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const urlRoom = urlParams.get('room');
            if (urlRoom) {
                appState.sync.roomKey = sanitizeRoomKey(urlRoom);
            }

            loadStateFromStorage();
            loadSessionFromStorage();

            if (urlRoom) {
                appState.sync.roomKey = sanitizeRoomKey(urlRoom);
                saveStateToStorage(false);
            }

            if (appState.teams.length === 0 && appState.matches.length === 0) {
                populateDemoData(false);
            }

            const urlMode = urlParams.get('mode');
            if (urlMode === 'public') {
                sessionState.role = 'public';
                sessionState.forcedPublic = true;
            } else if (urlMode === 'referee') {
                sessionState.role = 'public';
                sessionState.forcedPublic = false;
                setTimeout(() => openLoginModal('referee'), 150);
            } else if (urlMode === 'admin') {
                sessionState.role = 'public';
                sessionState.forcedPublic = false;
                setTimeout(() => openLoginModal('admin'), 150);
            }

            window.addEventListener('storage', (e) => {
                if (e.key === getStorageKeyForRoom(getActiveRoomKey()) && e.newValue) {
                    try {
                        const updated = JSON.parse(e.newValue);
                        window.mergeRemoteTournamentPayload(updated);
                    } catch (err) {
                        console.error('Błąd synchronizacji między kartami:', err);
                    }
                }
            });

            syncSettingsForm();
            applyRoleUI();
            renderAll();
            startCloudSyncLoop();
        });

        window.getSerializableTournamentState = function() {
            return {
                ...appState,
                updatedAt: appState.updatedAt || Date.now()
            };
        };

        window.mergeRemoteTournamentPayload = function(remoteData) {
            if (!remoteData || typeof remoteData !== 'object') return;

            const currentRoom = getActiveRoomKey();
            const remoteRoom = sanitizeRoomKey(remoteData.sync && remoteData.sync.roomKey);
            if (remoteData.sync && remoteData.sync.roomKey && remoteRoom !== currentRoom) {
                return;
            }

            const remoteTs = Number(remoteData.updatedAt) || 0;
            const localTs = Number(appState.updatedAt) || 0;
            const isRemoteNewerGlobal = remoteTs >= localTs;

            if (remoteData.config && (isRemoteNewerGlobal || appState.teams.length === 0)) {
                appState.config = { ...appState.config, ...remoteData.config };
            }
            if (remoteData.security && isRemoteNewerGlobal) {
                appState.security = { ...appState.security, ...remoteData.security };
            }

            if (Array.isArray(remoteData.teams) && remoteData.teams.length > 0) {
                if (isRemoteNewerGlobal || appState.teams.length === 0) {
                    appState.teams = remoteData.teams;
                } else {
                    const teamMap = new Map(appState.teams.map(t => [t.id, t]));
                    remoteData.teams.forEach(rt => {
                        if (!teamMap.has(rt.id)) teamMap.set(rt.id, rt);
                    });
                    appState.teams = Array.from(teamMap.values());
                }
            }

            if (Array.isArray(remoteData.matches) && remoteData.matches.length > 0) {
                if (appState.matches.length === 0) {
                    appState.matches = remoteData.matches;
                } else {
                    const localMatchMap = new Map(appState.matches.map(m => [m.id, m]));
                    const mergedMatches = [];
                    const seenIds = new Set();

                    remoteData.matches.forEach(rm => {
                        seenIds.add(rm.id);
                        const lm = localMatchMap.get(rm.id);
                        if (!lm) {
                            mergedMatches.push(rm);
                        } else {
                            const rMatchTs = Number(rm.matchUpdatedAt || rm.updatedAt || remoteTs) || 0;
                            const lMatchTs = Number(lm.matchUpdatedAt || lm.updatedAt || localTs) || 0;
                            if (rMatchTs >= lMatchTs) {
                                mergedMatches.push(rm);
                            } else {
                                mergedMatches.push(lm);
                            }
                        }
                    });

                    appState.matches.forEach(lm => {
                        if (!seenIds.has(lm.id)) {
                            mergedMatches.push(lm);
                        }
                    });

                    appState.matches = mergedMatches;
                }
            }

            if (remoteTs > localTs) {
                appState.updatedAt = remoteTs;
            }
            appState.sync.lastSyncAt = new Date().toLocaleTimeString('pl-PL');
            appState.sync.lastStatus = 'Zsynchronizowano';

            try {
                localStorage.setItem(getStorageKeyForRoom(currentRoom), JSON.stringify(appState));
            } catch (e) {}

            renderAll();
        };

        function saveStateToStorage(pushToCloud = true, changedMatchId = null) {
            try {
                const now = Date.now();
                appState.updatedAt = now;
                if (changedMatchId) {
                    const m = appState.matches.find(x => x.id === changedMatchId);
                    if (m) m.matchUpdatedAt = now;
                }
                const key = getStorageKeyForRoom(getActiveRoomKey());
                localStorage.setItem(key, JSON.stringify(appState));

                if (pushToCloud && appState.sync && appState.sync.enabled) {
                    pushStateToCloudEndpoint();
                    if (window.pushStateToFirestoreIfReady) {
                        window.pushStateToFirestoreIfReady();
                    }
                }
            } catch (e) {
                console.error('Błąd zapisu stanu:', e);
            }
        }

        function loadStateFromStorage() {
            try {
                const key = getStorageKeyForRoom(getActiveRoomKey());
                const raw = localStorage.getItem(key);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    appState = {
                        ...appState,
                        ...parsed,
                        updatedAt: Number(parsed.updatedAt) || Date.now(),
                        config: { ...appState.config, ...(parsed.config || {}) },
                        sync: { ...appState.sync, ...(parsed.sync || {}) },
                        security: { ...appState.security, ...(parsed.security || {}) }
                    };
                }
            } catch (e) {
                console.error('Błąd odczytu stanu:', e);
            }
        }

        function saveSessionToStorage() {
            try {
                sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionState));
            } catch (e) {}
        }

        function loadSessionFromStorage() {
            try {
                const raw = sessionStorage.getItem(SESSION_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    sessionState = { ...sessionState, ...parsed };
                }
            } catch (e) {}
        }

        // =========================================================================
        // SILNIK SYNCHRONIZACJI CHMUROWEJ (WIELU KOMÓREK JEDNOCZEŚNIE)
        // =========================================================================
        function getCloudEndpointUrl() {
            const syncCfg = appState.sync || {};
            const room = sanitizeRoomKey(syncCfg.roomKey);
            if (syncCfg.provider === 'CUSTOM_JSON_ENDPOINT' && syncCfg.customUrl && syncCfg.customUrl.trim()) {
                return syncCfg.customUrl.trim().replace('{room}', encodeURIComponent(room));
            }
            return `https://kvdb.io/${DEFAULT_KVDB_BUCKET}/volley_${room}`;
        }

        async function pushStateToCloudEndpoint() {
            if (!appState.sync || !appState.sync.enabled) return;
            const url = getCloudEndpointUrl();
            if (!url) return;

            try {
                appState.sync.lastStatus = 'Wysyłanie...';
                updateSyncStatusIndicators();

                const bodyPayload = JSON.stringify({
                    ...appState,
                    sync: {
                        enabled: appState.sync.enabled,
                        roomKey: getActiveRoomKey(),
                        provider: appState.sync.provider
                    }
                });

                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: bodyPayload
                });

                if (res.ok) {
                    appState.sync.lastSyncAt = new Date().toLocaleTimeString('pl-PL');
                    appState.sync.lastStatus = 'Online (Wysłano)';
                } else {
                    appState.sync.lastStatus = 'Lokalnie (brak połączenia z chmurą)';
                }
            } catch (e) {
                appState.sync.lastStatus = 'Lokalnie (offline / ograniczenie sieci)';
            } finally {
                updateSyncStatusIndicators();
            }
        }
